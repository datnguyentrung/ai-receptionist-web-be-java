spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/version_4}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000
      validation-timeout: 5000
      initialization-fail-timeout: 60000
      auto-commit: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:10s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:10s}

      ssl:
        enabled: ${SSL_ENABLED:false}
        disable-peer-verification: ${SPRING_DATA_REDIS_SSL_DISABLE_PEER_VERIFICATION:true}

      repositories:
        enabled: true

  threads:
    virtual:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    database: PostgreSQL
    show-sql: true
    open-in-view: false
    repositories:
      enabled: true
    defer-datasource-initialization: false
    properties:
      hibernate:
        generate_statistics: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
          batch_size: 50
          order_updates: true
          order_inserts: true
          batch_versioned_data: true
        connection:
          provider_disables_autocommit: true
        query:
          plan_cache_max_size: 2048
          plan_parameter_metadata_max_size: 128

  #        temp:
  #          use_jdbc_metadata_defaults: false
  #        boot:
  #          allow_jdbc_metadata_access: false

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  Jackson:
    time-zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: false

logging:
  level:
#      org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport: ERROR
#      org.springframework.security: WARN
#      com.zaxxer.hikari: WARN
#      org.hibernate: WARN
#      org.postgresql: WARN
#      root: INFO
#      org.springframework.web: INFO

    root: INFO

    # 1.
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF

    # 2.
    org.hibernate.stat: ERROR
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: INFO
    org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport: ERROR

    # 3.
    org.springframework.web: DEBUG # Log các yêu cầu HTTP và phản hồi
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.springframework.security: WARN # Log các sự kiện liên quan đến bảo mật
    com.zaxxer.hikari: WARN # Log các sự kiện liên quan đến HikariCP
    org.postgresql: WARN

jwt:
  base64-secret: ${JWT_BASE64_SECRET}
  access-token-validity-in-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_IN_SECONDS}
  refresh-token-validity-in-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_IN_SECONDS}

rate-limit:
  # Enable only when the edge proxy overwrites X-Forwarded-For from untrusted clients.
  trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
  policies:
    - name: login-web
      path: /api/v1/auth/login
      method: POST
      limit: 5
      window: 5m
      subject: IP
    - name: login-mobile
      path: /api/v1/auth/mobile/login
      method: POST
      limit: 5
      window: 5m
      subject: IP
    - name: refresh-web
      path: /api/v1/auth/refresh
      method: POST
      limit: 10
      window: 5m
      subject: IP
    - name: refresh-mobile
      path: /api/v1/auth/mobile/refresh
      method: POST
      limit: 10
      window: 5m
      subject: IP
    - name: wallet-top-up
      path: /api/v1/wallets/top-up
      method: POST
      limit: 10
      window: 1m
      subject: AUTHENTICATED
    - name: course-purchase
      path: /api/v1/wallets/course-purchases
      method: POST
      limit: 5
      window: 1m
      subject: AUTHENTICATED
    - name: wallet-refund
      path: /api/v1/wallets/refunds
      method: POST
      limit: 5
      window: 1m
      subject: AUTHENTICATED
    - name: authenticated-default
      path: /api/**
      limit: 300
      window: 1m
      subject: AUTO

